<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a8a29e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1060" rx="28" fill="#fafaf9"/>

  <!-- PANEL 1: THE TRAP -->
  <rect x="48" y="40" width="1104" height="264" rx="24" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <text x="96" y="104" font-size="22" font-weight="700" letter-spacing="4" fill="#dc2626">THE TRAP</text>
  <text x="96" y="164" font-size="36" font-weight="800" fill="#1c1917">Chat threads pile up.</text>
  <text x="96" y="210" font-size="36" font-weight="800" fill="#1c1917">Open loops die in the scroll.</text>
  <text x="96" y="262" font-size="22" fill="#57534e">A manual todo list is a second job — for an ADHD brain, a second job is a fantasy.</text>

  <!-- arrow 1 -->
  <line x1="600" y1="320" x2="600" y2="368" stroke="#a8a29e" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- PANEL 2: THE INSIGHT -->
  <rect x="48" y="384" width="1104" height="264" rx="24" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
  <text x="96" y="448" font-size="22" font-weight="700" letter-spacing="4" fill="#d97706">THE INSIGHT</text>
  <text x="96" y="508" font-size="36" font-weight="800" fill="#1c1917">Don&#8217;t organize tasks.</text>
  <text x="96" y="554" font-size="36" font-weight="800" fill="#1c1917">Catch them where they already live.</text>
  <text x="96" y="606" font-size="22" fill="#57534e">The system has to do the noticing — scan my chats, not my memory.</text>

  <!-- arrow 2 -->
  <line x1="600" y1="664" x2="600" y2="712" stroke="#a8a29e" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- PANEL 3: THE MACHINE -->
  <rect x="48" y="728" width="1104" height="292" rx="24" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="96" y="792" font-size="22" font-weight="700" letter-spacing="4" fill="#4f46e5">THE MACHINE</text>

  <!-- step 1 -->
  <circle cx="130" cy="872" r="30" fill="#4f46e5"/>
  <text x="130" y="882" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <text x="176" y="862" font-size="24" font-weight="800" fill="#1c1917">SCAN</text>
  <text x="176" y="894" font-size="20" fill="#57534e">Reads every thread,</text>
  <text x="176" y="922" font-size="20" fill="#57534e">finds open loops.</text>

  <!-- step 2 -->
  <circle cx="498" cy="872" r="30" fill="#4f46e5"/>
  <text x="498" y="882" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  <text x="544" y="862" font-size="24" font-weight="800" fill="#1c1917">BOARD</text>
  <text x="544" y="894" font-size="20" fill="#57534e">One prioritized list,</text>
  <text x="544" y="922" font-size="20" fill="#57534e">most urgent first.</text>

  <!-- step 3 -->
  <circle cx="866" cy="872" r="30" fill="#4f46e5"/>
  <text x="866" y="882" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  <text x="912" y="862" font-size="24" font-weight="800" fill="#1c1917">NUDGE</text>
  <text x="912" y="894" font-size="20" fill="#57534e">Reminds you until</text>
  <text x="912" y="922" font-size="20" fill="#57534e">you confirm it&#8217;s shipped.</text>

  <!-- step connectors -->
  <line x1="404" y1="872" x2="436" y2="872" stroke="#a5b4fc" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="772" y1="872" x2="804" y2="872" stroke="#a5b4fc" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- footer line -->
  <text x="600" y="986" font-size="24" font-style="italic" font-weight="600" fill="#4338ca" text-anchor="middle">Produced is not shipped.</text>
</svg>
