<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1068" viewBox="0 0 1200 1068" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a8a29e"/>
    </marker>
    <marker id="arrowIndigo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#818cf8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1068" rx="28" fill="#fafaf9"/>

  <!-- PANEL 1: THE PROBLEM, PREFRAMED -->
  <rect x="48" y="40" width="1104" height="264" rx="24" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <text x="96" y="104" font-size="22" font-weight="700" letter-spacing="4" fill="#dc2626">THE PROBLEM, PREFRAMED</text>
  <text x="96" y="168" font-size="36" font-weight="800" fill="#1c1917">Chat threads pile up.</text>
  <text x="96" y="214" font-size="36" font-weight="800" fill="#1c1917">Open loops die in the scroll.</text>
  <text x="96" y="268" font-size="25" font-weight="600" fill="#991b1b">The job isn&#8217;t organizing tasks. It&#8217;s noticing them.</text>

  <!-- arrow 1 -->
  <line x1="600" y1="320" x2="600" y2="368" stroke="#a8a29e" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- PANEL 2: THE ENGINE -->
  <rect x="48" y="384" width="1104" height="300" rx="24" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="96" y="448" font-size="22" font-weight="700" letter-spacing="4" fill="#4f46e5">THE ENGINE</text>
  <text x="96" y="486" font-size="22" fill="#57534e">A backend made of rules and loops — no code required.</text>

  <!-- node 1 -->
  <rect x="96" y="520" width="240" height="120" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="120" y="558" font-size="20" font-weight="800" letter-spacing="2" fill="#4338ca">SCHEDULE</text>
  <text x="120" y="590" font-size="18" fill="#57534e">Every morning,</text>
  <text x="120" y="614" font-size="18" fill="#57534e">on its own.</text>

  <!-- node 2 -->
  <rect x="368" y="520" width="240" height="120" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="392" y="558" font-size="20" font-weight="800" letter-spacing="2" fill="#4338ca">SCAN</text>
  <text x="392" y="590" font-size="18" fill="#57534e">Open-loop criteria,</text>
  <text x="392" y="614" font-size="18" fill="#57534e">dedup.</text>

  <!-- node 3 -->
  <rect x="640" y="520" width="240" height="120" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="664" y="558" font-size="20" font-weight="800" letter-spacing="2" fill="#4338ca">RANK</text>
  <text x="664" y="590" font-size="18" fill="#57534e">Urgency rubric,</text>
  <text x="664" y="614" font-size="18" fill="#57534e">most urgent first.</text>

  <!-- node 4 -->
  <rect x="912" y="520" width="240" height="120" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="936" y="558" font-size="20" font-weight="800" letter-spacing="2" fill="#4338ca">GATE</text>
  <text x="936" y="590" font-size="18" fill="#57534e">Produced isn&#8217;t shipped —</text>
  <text x="936" y="614" font-size="18" fill="#57534e">only you confirm.</text>

  <!-- node connectors -->
  <line x1="342" y1="580" x2="362" y2="580" stroke="#818cf8" stroke-width="3" marker-end="url(#arrowIndigo)"/>
  <line x1="614" y1="580" x2="634" y2="580" stroke="#818cf8" stroke-width="3" marker-end="url(#arrowIndigo)"/>
  <line x1="886" y1="580" x2="906" y2="580" stroke="#818cf8" stroke-width="3" marker-end="url(#arrowIndigo)"/>

  <!-- arrow 2 -->
  <line x1="600" y1="700" x2="600" y2="748" stroke="#a8a29e" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- PANEL 3: THE SURFACE -->
  <rect x="48" y="764" width="1104" height="264" rx="24" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <text x="96" y="828" font-size="22" font-weight="700" letter-spacing="4" fill="#16a34a">THE SURFACE</text>
  <text x="96" y="892" font-size="36" font-weight="800" fill="#1c1917">One board. One &#8220;right now.&#8221;</text>
  <text x="96" y="938" font-size="36" font-weight="800" fill="#1c1917">Plain words.</text>
  <text x="96" y="990" font-size="22" fill="#57534e">All of the machinery above, none of the noise.</text>
</svg>
